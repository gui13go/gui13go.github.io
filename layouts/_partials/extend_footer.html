{{- /* Interactive Checkboxes / Task Lists with LocalStorage Persistence */ -}}
<script>
document.addEventListener("DOMContentLoaded", function () {
  const taskCheckboxes = document.querySelectorAll(".post-content li > input[type='checkbox']");
  if (!taskCheckboxes.length) return;

  const pageKey = "checklist_state_" + window.location.pathname;
  let savedState = {};
  try {
    savedState = JSON.parse(localStorage.getItem(pageKey) || "{}");
  } catch (e) {
    savedState = {};
  }

  taskCheckboxes.forEach(function (checkbox, index) {
    // Enable the checkbox
    checkbox.removeAttribute("disabled");
    checkbox.style.cursor = "pointer";

    const li = checkbox.closest("li");
    if (li) {
      li.classList.add("interactive-task-item");
      const ul = li.closest("ul");
      if (ul) ul.classList.add("interactive-task-list");

      // Restore checked state from localStorage
      if (savedState[index]) {
        checkbox.checked = true;
        li.classList.add("task-checked");
      }

      // Allow clicking the list item text to toggle the checkbox
      li.addEventListener("click", function (event) {
        if (event.target.tagName === "A" || event.target.tagName === "CODE" || event.target === checkbox) {
          return;
        }
        checkbox.checked = !checkbox.checked;
        checkbox.dispatchEvent(new Event("change"));
      });

      // Handle state change
      checkbox.addEventListener("change", function () {
        if (checkbox.checked) {
          li.classList.add("task-checked");
          savedState[index] = true;
        } else {
          li.classList.remove("task-checked");
          delete savedState[index];
        }
        try {
          localStorage.setItem(pageKey, JSON.stringify(savedState));
        } catch (e) {}
      });
    }
  });
});
</script>

{{- /* Smart Auto-hiding Header: slide up on scroll down, slide down on scroll up */ -}}
<script>
(function () {
  const header = document.querySelector(".header");
  if (!header) return;

  let lastScrollY = Math.max(0, window.pageYOffset || document.documentElement.scrollTop || 0);
  let ticking = false;
  const deltaThreshold = 8;
  let accumulatedScroll = 0;
  let lastDirection = 0; // 1: down, -1: up

  function updateHeader() {
    const currentScrollY = Math.max(0, window.pageYOffset || document.documentElement.scrollTop || 0);
    const diff = currentScrollY - lastScrollY;
    const headerHeight = header.offsetHeight || 60;

    // Always keep header visible at the very top of the page
    if (currentScrollY <= headerHeight) {
      header.classList.remove("header-hidden");
      accumulatedScroll = 0;
      lastDirection = 0;
      lastScrollY = currentScrollY;
      ticking = false;
      return;
    }

    const direction = diff > 0 ? 1 : diff < 0 ? -1 : 0;

    if (direction !== 0) {
      if (direction !== lastDirection) {
        accumulatedScroll = 0;
        lastDirection = direction;
      }
      accumulatedScroll += Math.abs(diff);

      if (accumulatedScroll >= deltaThreshold) {
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        // Avoid hiding when overscrolling at the bottom of the page (Safari / mobile bounce)
        if (currentScrollY < maxScroll - 10 || direction === -1) {
          if (direction === 1) {
            header.classList.add("header-hidden");
          } else {
            header.classList.remove("header-hidden");
          }
        }
      }
    }

    lastScrollY = currentScrollY;
    ticking = false;
  }

  function onScroll() {
    if (!ticking) {
      window.requestAnimationFrame(updateHeader);
      ticking = true;
    }
  }

  window.addEventListener("scroll", onScroll, { passive: true });

  window.addEventListener("resize", function () {
    if ((window.pageYOffset || document.documentElement.scrollTop || 0) <= (header.offsetHeight || 60)) {
      header.classList.remove("header-hidden");
    }
  }, { passive: true });
})();
</script>

{{- /* Mobile Hamburger Menu Logic */ -}}
<script>
document.addEventListener('DOMContentLoaded', () => {
    const menuToggle = document.getElementById('menu-toggle');
    const menu = document.getElementById('menu');
    const menuIcon = menuToggle?.querySelector('.menu-icon');
    const closeIcon = menuToggle?.querySelector('.close-icon');
    const header = document.querySelector('.header');

    if (!menuToggle || !menu) return;

    function toggleMenu() {
        const isExpanded = menuToggle.getAttribute('aria-expanded') === 'true';
        menuToggle.setAttribute('aria-expanded', !isExpanded);
        menu.classList.toggle('show');
        
        if (menuIcon && closeIcon) {
            menuIcon.style.display = isExpanded ? 'block' : 'none';
            closeIcon.style.display = isExpanded ? 'none' : 'block';
        }
        
        // Prevent body scroll when menu is open
        document.body.style.overflow = isExpanded ? '' : 'hidden';
    }

    function closeMenu() {
        menuToggle.setAttribute('aria-expanded', 'false');
        menu.classList.remove('show');
        if (menuIcon && closeIcon) {
            menuIcon.style.display = 'block';
            closeIcon.style.display = 'none';
        }
        document.body.style.overflow = '';
    }

    menuToggle.addEventListener('click', toggleMenu);

    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
        if (!header.contains(e.target) && menu.classList.contains('show')) {
            closeMenu();
        }
    });

    // Close menu on Escape key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && menu.classList.contains('show')) {
            closeMenu();
        }
    });

    // Close menu when clicking a link
    menu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', closeMenu);
    });

    // Reset state on window resize (desktop breakpoint)
    window.addEventListener('resize', () => {
        if (window.innerWidth >= 768 && menu.classList.contains('show')) {
            closeMenu();
        }
    });
});
</script>

{{- /* Header Search Bar Logic */ -}}
<script>
document.addEventListener('DOMContentLoaded', () => {
    const searchForm = document.getElementById('header-search-form');
    const searchInput = document.getElementById('header-search-input');
    const searchDropdown = document.getElementById('header-search-dropdown');
    const searchResults = document.getElementById('header-search-results');
    const searchClear = document.getElementById('header-search-clear');
    const searchFooter = document.getElementById('header-search-footer');
    const searchViewAll = document.getElementById('header-search-view-all');
    const searchViewAllTerm = document.getElementById('header-search-view-all-term');
    const searchCount = document.getElementById('header-search-count');
    const searchContainer = document.getElementById('header-search');

    if (!searchInput || !searchDropdown || !searchResults || !searchContainer) return;

    let indexData = null;
    let isLoading = false;
    let activeIndex = -1;
    let debounceTimer = null;

    const tagIcons = {
        'Blog': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>',
        'Tool': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>',
        'GeoLayer': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>',
        'Publication': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>',
        'Gallery': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>',
        'About': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>',
        'Page': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>'
    };

    async function loadIndex() {
        if (indexData || isLoading) return indexData;
        isLoading = true;
        try {
            const res = await fetch('{{ "index.json" | relLangURL }}');
            if (res.ok) {
                indexData = await res.json();
            }
        } catch (e) {
            console.error('Failed to load search index:', e);
        } finally {
            isLoading = false;
        }
        return indexData;
    }

    function getSectionTag(url) {
        if (!url) return 'Page';
        if (url.includes('/blogs/')) return 'Blog';
        if (url.includes('/tools/')) return 'Tool';
        if (url.includes('/geolayers/')) return 'GeoLayer';
        if (url.includes('/publications/')) return 'Publication';
        if (url.includes('/gallery/')) return 'Gallery';
        if (url.includes('/about/')) return 'About';
        return 'Page';
    }

    function highlightMatch(text, query) {
        if (!text || !query) return text || '';
        const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`(${escaped})`, 'gi');
        return text.replace(regex, '<mark class="header-search-mark">$1</mark>');
    }

    function escapeHtml(str) {
        return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function goToSearchPage(query) {
        const targetQuery = query !== undefined ? query : searchInput.value.trim();
        const base = '{{ "search/" | relLangURL }}';
        window.location.href = targetQuery ? `${base}?q=${encodeURIComponent(targetQuery)}` : base;
    }

    function renderDropdown(items, query) {
        searchResults.innerHTML = '';
        activeIndex = -1;

        if (!items || items.length === 0) {
            if (searchCount) searchCount.textContent = 'No suggestions';

            const li = document.createElement('li');
            li.className = 'header-search-empty';
            
            const emptyText = document.createElement('div');
            emptyText.className = 'header-search-empty-text';
            emptyText.textContent = `No suggestions found for "${query}"`;

            const fullSearchBtn = document.createElement('button');
            fullSearchBtn.type = 'button';
            fullSearchBtn.className = 'header-search-empty-btn';
            fullSearchBtn.innerHTML = `Search full site for "<strong>${escapeHtml(query)}</strong>" &rarr;`;
            fullSearchBtn.addEventListener('click', (e) => {
                e.preventDefault();
                goToSearchPage(query);
            });

            li.appendChild(emptyText);
            li.appendChild(fullSearchBtn);
            searchResults.appendChild(li);

            if (searchFooter) searchFooter.style.display = 'none';
            searchDropdown.style.display = 'block';
            return;
        }

        if (searchCount) {
            searchCount.textContent = `${items.length} suggestion${items.length === 1 ? '' : 's'}`;
        }

        items.forEach((item, index) => {
            const li = document.createElement('li');
            li.className = 'header-search-item';
            li.dataset.index = index;

            const a = document.createElement('a');
            a.href = item.permalink;

            const titleDiv = document.createElement('div');
            titleDiv.className = 'header-search-item-title';
            
            const titleLeft = document.createElement('div');
            titleLeft.className = 'header-search-item-left';

            const sectionName = getSectionTag(item.permalink);
            const tagSpan = document.createElement('span');
            tagSpan.className = `header-search-tag tag-${sectionName.toLowerCase()}`;
            tagSpan.innerHTML = `${tagIcons[sectionName] || tagIcons['Page']}<span>${sectionName}</span>`;

            const titleSpan = document.createElement('span');
            titleSpan.className = 'header-search-title-text';
            titleSpan.innerHTML = highlightMatch(item.title, query);

            titleLeft.appendChild(tagSpan);
            titleLeft.appendChild(titleSpan);

            const arrowIcon = document.createElement('span');
            arrowIcon.className = 'header-search-item-arrow';
            arrowIcon.innerHTML = '&rarr;';

            titleDiv.appendChild(titleLeft);
            titleDiv.appendChild(arrowIcon);

            const descDiv = document.createElement('div');
            descDiv.className = 'header-search-item-desc';
            const snippet = item.summary || item.content || '';
            const plainSnippet = snippet.replace(/<[^>]*>?/gm, '').slice(0, 95);
            descDiv.innerHTML = highlightMatch(plainSnippet, query) + (plainSnippet.length >= 95 ? '...' : '');

            a.appendChild(titleDiv);
            if (plainSnippet) a.appendChild(descDiv);

            li.appendChild(a);
            searchResults.appendChild(li);
        });

        if (searchFooter && searchViewAll) {
            const fullUrl = `{{ "search/" | relLangURL }}?q=${encodeURIComponent(query)}`;
            searchViewAll.href = fullUrl;
            if (searchViewAllTerm) {
                searchViewAllTerm.textContent = query;
            }
            searchFooter.style.display = 'block';
        }

        searchDropdown.style.display = 'block';
    }

    function updateActiveItem(items) {
        items.forEach((item, i) => {
            if (i === activeIndex) {
                item.classList.add('active');
                item.scrollIntoView({ block: 'nearest' });
            } else {
                item.classList.remove('active');
            }
        });
    }

    async function performSearch() {
        const query = searchInput.value.trim();
        if (!query) {
            searchDropdown.style.display = 'none';
            if (searchClear) searchClear.style.display = 'none';
            return;
        }

        if (searchClear) searchClear.style.display = 'flex';

        const data = await loadIndex();
        if (!data) return;

        const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
        const scored = [];

        for (const item of data) {
            const title = (item.title || '').toLowerCase();
            const summary = (item.summary || '').toLowerCase();
            const content = (item.content || '').toLowerCase();

            let matchesAll = true;
            let score = 0;

            for (const term of terms) {
                let termScore = 0;
                if (title.includes(term)) {
                    termScore += title.startsWith(term) ? 25 : 12;
                }
                if (summary.includes(term)) {
                    termScore += 4;
                }
                if (content.includes(term)) {
                    termScore += 1;
                }
                if (termScore === 0) {
                    matchesAll = false;
                    break;
                }
                score += termScore;
            }

            if (matchesAll && score > 0) {
                scored.push({ item, score });
            }
        }

        scored.sort((a, b) => b.score - a.score);
        const topResults = scored.slice(0, 6).map(s => s.item);
        renderDropdown(topResults, query);
    }

    // Input events
    searchInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(performSearch, 130);
    });

    searchInput.addEventListener('focus', () => {
        loadIndex();
        if (searchInput.value.trim()) {
            performSearch();
        }
    });

    // Clear button
    if (searchClear) {
        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchClear.style.display = 'none';
            searchDropdown.style.display = 'none';
            searchInput.focus();
        });
    }

    // Form submit
    if (searchForm) {
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            goToSearchPage();
        });
    }

    // View All button click (explicit navigation handler)
    if (searchViewAll) {
        searchViewAll.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            goToSearchPage();
        });
    }

    // Keyboard navigation
    searchInput.addEventListener('keydown', (e) => {
        const items = searchResults.querySelectorAll('.header-search-item');

        if (e.key === 'ArrowDown') {
            if (searchDropdown.style.display !== 'none' && items.length > 0) {
                e.preventDefault();
                activeIndex = (activeIndex + 1) % items.length;
                updateActiveItem(items);
            }
        } else if (e.key === 'ArrowUp') {
            if (searchDropdown.style.display !== 'none' && items.length > 0) {
                e.preventDefault();
                activeIndex = (activeIndex - 1 + items.length) % items.length;
                updateActiveItem(items);
            }
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (activeIndex >= 0 && items[activeIndex]) {
                const link = items[activeIndex].querySelector('a');
                if (link) window.location.href = link.href;
            } else {
                goToSearchPage();
            }
        } else if (e.key === 'Escape') {
            searchDropdown.style.display = 'none';
            searchInput.blur();
        }
    });

    // Global keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        const activeTag = document.activeElement ? document.activeElement.tagName : '';
        const isEditable = activeTag === 'INPUT' || activeTag === 'TEXTAREA' || (document.activeElement && document.activeElement.isContentEditable);

        if (!isEditable) {
            if (e.key === '/' || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            }
        }
    });

    // Click outside to close dropdown
    document.addEventListener('click', (e) => {
        if (!searchContainer.contains(e.target)) {
            searchDropdown.style.display = 'none';
        }
    });
});
</script>
