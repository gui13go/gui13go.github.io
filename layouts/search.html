{{- define "main" }}

<header class="gallery-header">
  <div class="gallery-breadcrumbs">
    <a href="{{ site.BaseURL }}">Home</a> <span>/</span> <span>Search</span>
  </div>
  <h1 class="gallery-title">Search</h1>
  <p class="gallery-subtitle">{{ .Description | default "Search blog posts, tools, geolayers, and publications across the site." }}</p>
</header>

<div id="searchbox" class="searchbox">
    <input id="searchInput" disabled placeholder="{{ .Params.placeholder | default (printf "%s ↵" .Title) }}"
        aria-label="search" type="search" autocomplete="off" maxlength="64">
    <ul id="searchResults" class="searchResults" aria-label="search results"></ul>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const params = new URLSearchParams(window.location.search);
    const q = params.get("q");
    if (q) {
        const sInput = document.getElementById("searchInput");
        const resList = document.getElementById("searchResults");
        if (sInput) {
            sInput.value = q;
            let attempts = 0;
            const timer = setInterval(() => {
                attempts++;
                if (!sInput.disabled) {
                    sInput.dispatchEvent(new Event("input", { bubbles: true }));
                }
                // Stop once results are rendered or after 25 attempts (~2.5s)
                if ((resList && resList.children.length > 0) || attempts > 25) {
                    clearInterval(timer);
                }
            }, 100);
        }
    }
});
</script>

{{- end }}
