baseURL = 'https://gui13go.github.io/'
languageCode = 'en-us'
title = 'Guilherme Viegas'
theme = 'PaperMod'

enableEmoji = true

[pagination]
  pagerSize = 10

[params]
  env = 'production'
  title = 'Guilherme Viegas'
  description = 'Personal technical blog on GNU/Linux, Systems Engineering, Security, Virtualization, and Cloud Architecture.'
  keywords = ['Blog', 'Linux', 'Security', 'Kubernetes', 'Cloud', 'DevOps', 'Systems']
  author = 'Guilherme Viegas'

  [params.profileMode]
    enabled = true
    title = 'Guilherme Viegas'
    subtitle = 'Systems Engineer & Researcher'

  # Theme settings
  defaultTheme = 'auto' # auto, dark, light
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = true

  # Social Icons
  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/gui13go'

  [[params.socialIcons]]
    name = 'substack'
    url = 'https://guilhermeviegas.substack.com'

  # Cover image settings
  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false

  # Fast Search
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1_000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ['title', 'permalink', 'summary', 'content']

# Main Menu with "Blogs" tab
[menu]
  [[menu.main]]
    identifier = 'blogs'
    name = 'Blogs'
    url = '/posts/'
    weight = 10

  [[menu.main]]
    identifier = 'tags'
    name = 'Tags'
    url = '/tags/'
    weight = 20

  [[menu.main]]
    identifier = 'categories'
    name = 'Categories'
    url = '/categories/'
    weight = 30

  [[menu.main]]
    identifier = 'search'
    name = 'Search'
    url = '/search/'
    weight = 40

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[taxonomies]
  category = 'categories'
  tag = 'tags'

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = 'dracula'
  [markup.goldmark.renderer]
    unsafe = true
