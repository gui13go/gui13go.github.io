    <rect x="0" y="0" width="56" height="56" rx="12" fill="rgba(255,255,255,0.06)" stroke="#FBBF24" stroke-width="1.8"/>
    <text x="28" y="35" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" text-anchor="middle">TIME</text>

    <!-- Subtitle Category Badge -->
    <rect x="68" y="4" width="261" height="24" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="80" cy="16" r="4" fill="#FBBF24"/>
    <text x="92" y="20" fill="#FBBF24" font-family="monospace" font-size="11" font-weight="700" letter-spacing="0.05em">TIME-SERIES HYPERTABLES ENGINE</text>
  </g>

  <!-- Database Title -->
  <text x="48" y="165" fill="#f8fafc" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="900" font-size="46" letter-spacing="-0.03em">TimescaleDB</text>

  <!-- Architectural Internals Specification List -->
  <g transform="translate(48, 205)">
