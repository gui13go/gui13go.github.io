          <ellipse cx="130" cy="80" rx="30" ry="9" fill="#0f172a" stroke="rgba(255,255,255,0.2)"/>
          
          <!-- Disk 2 -->
          <path d="M 50 80 v 40 a 80 24 0 0 0 160 0 v -40" fill="#1e293b" stroke="#FBBF24" stroke-width="2"/>
          <ellipse cx="130" cy="120" rx="80" ry="24" fill="#94a3b8" stroke="#FBBF24" stroke-width="1"/>

          <!-- Disk 3 -->
          <path d="M 50 120 v 40 a 80 24 0 0 0 160 0 v -40" fill="#0f172a" stroke="#FBBF24" stroke-width="2"/>
