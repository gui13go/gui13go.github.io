    <text x="0" y="0" fill="#94a3b8" font-family="monospace" font-size="11">ENGINE SPEC: v2026 // OPEN TECHNICAL TAXONOMY</text>
    <text x="704" y="0" fill="#FBBF24" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">Gui13go Database Gallery &rarr;</text>
