    <text x="18" y="28" fill="#FBBF24" font-family="monospace" font-size="11" font-weight="700" letter-spacing="0.06em">ENGINE ARCHITECTURE &amp; INTERNALS</text>
    <line x1="18" y1="38" x2="362" y2="38" stroke="rgba(255,255,255,0.08)"/>

    
      <g transform="translate(18, 58)">
