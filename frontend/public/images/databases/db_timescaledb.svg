      <g transform="translate(18, 114)">
        <circle cx="5" cy="5" r="3.5" fill="#FBBF24"/>
        <text x="16" y="9" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600">95% DISK SAVINGS</text>
      </g>
    
      <g transform="translate(18, 142)">
        <circle cx="5" cy="5" r="3.5" fill="#FBBF24"/>
        <text x="16" y="9" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600">NATIVE POSTGRES SQL</text>
      </g>
    
  </g>

  <!-- Right Side Interactive Architectural Blueprint -->
  
        <!-- Generic Storage Disk & Engine Diagram -->
        <g transform="translate(480, 110)">
          <rect x="0" y="0" width="260" height="260" rx="14" fill="rgba(0,0,0,0.4)" stroke="#FBBF24" stroke-width="1.6"/>
          
          <!-- Disk 1 -->
