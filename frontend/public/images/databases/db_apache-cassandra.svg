<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad_CASS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04141c"/>
      <stop offset="50%" stop-color="#1287B1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="mesh_CASS" cx="20%" cy="15%" r="75%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#1287B1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <circle cx="32" cy="32" r="1" fill="rgba(255,255,255,0.08)"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#030712"/>
  <rect width="100%" height="100%" fill="url(#bgGrad_CASS)"/>
  <rect width="100%" height="100%" fill="url(#gridPattern)"/>
  <rect width="100%" height="100%" fill="url(#mesh_CASS)"/>

  <!-- Subtle Top Decorative Status Line -->
  <rect x="0" y="0" width="100%" height="4" fill="#38BDF8"/>

  <!-- Top Header Metadata Bar -->
  <g transform="translate(48, 44)">
    <!-- Symbol Shield -->
    <rect x="0" y="0" width="56" height="56" rx="12" fill="rgba(255,255,255,0.06)" stroke="#38BDF8" stroke-width="1.8"/>
    <text x="28" y="35" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" text-anchor="middle">CASS</text>

    <!-- Subtitle Category Badge -->
    <rect x="68" y="4" width="238" height="24" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="80" cy="16" r="4" fill="#38BDF8"/>
    <text x="92" y="20" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700" letter-spacing="0.05em">MASTERLESS WIDE-COLUMN RING</text>
  </g>

  <!-- Database Title -->
  <text x="48" y="165" fill="#f8fafc" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="900" font-size="46" letter-spacing="-0.03em">Apache Cassandra</text>

  <!-- Architectural Internals Specification List -->
  <g transform="translate(48, 205)">
    <rect x="0" y="0" width="380" height="180" rx="12" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>
    <text x="18" y="28" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700" letter-spacing="0.06em">ENGINE ARCHITECTURE &amp; INTERNALS</text>
    <line x1="18" y1="38" x2="362" y2="38" stroke="rgba(255,255,255,0.08)"/>

    
      <g transform="translate(18, 58)">
        <circle cx="5" cy="5" r="3.5" fill="#38BDF8"/>
        <text x="16" y="9" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600">PEER-TO-PEER HASH RING</text>
      </g>
    
      <g transform="translate(18, 86)">
        <circle cx="5" cy="5" r="3.5" fill="#38BDF8"/>
        <text x="16" y="9" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600">LSM-TREES ON SSTABLES</text>
      </g>
    
      <g transform="translate(18, 114)">
        <circle cx="5" cy="5" r="3.5" fill="#38BDF8"/>
        <text x="16" y="9" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600">TUNABLE CONSISTENCY</text>
      </g>
    
      <g transform="translate(18, 142)">
        <circle cx="5" cy="5" r="3.5" fill="#38BDF8"/>
        <text x="16" y="9" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600">MULTI-DC REPLICATION</text>
      </g>
    
  </g>

  <!-- Right Side Interactive Architectural Blueprint -->
  
        <!-- Distributed Cluster Ring / Consensus -->
        <g transform="translate(480, 110)">
          <rect x="0" y="0" width="260" height="260" rx="14" fill="#071927" stroke="#38BDF8" stroke-width="1.8"/>
          <text x="130" y="26" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">CONSENSUS TOPOLOGY</text>

          <!-- Outer Ring Orbit -->
          <circle cx="130" cy="145" r="80" fill="none" stroke="rgba(255,255,255,0.15)" stroke-dasharray="5,5" stroke-width="1.8"/>

          <!-- Nodes -->
          <circle cx="130" cy="65" r="18" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
          <text x="130" y="70" fill="#ffffff" font-family="monospace" font-size="10" font-weight="800" text-anchor="middle">N1</text>

          <circle cx="205" cy="120" r="18" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
          <text x="205" y="125" fill="#ffffff" font-family="monospace" font-size="10" font-weight="800" text-anchor="middle">N2</text>

          <circle cx="180" cy="200" r="18" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
          <text x="180" y="205" fill="#ffffff" font-family="monospace" font-size="10" font-weight="800" text-anchor="middle">N3</text>

          <circle cx="80" cy="200" r="18" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
          <text x="80" y="205" fill="#ffffff" font-family="monospace" font-size="10" font-weight="800" text-anchor="middle">N4</text>

          <circle cx="55" cy="120" r="18" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
          <text x="55" y="125" fill="#ffffff" font-family="monospace" font-size="10" font-weight="800" text-anchor="middle">N5</text>

          <!-- Heartbeat / Quorum Mesh -->
          <line x1="130" y1="65" x2="180" y2="200" stroke="#38BDF8" stroke-width="1.2" opacity="0.6"/>
          <line x1="130" y1="65" x2="80" y2="200" stroke="#38BDF8" stroke-width="1.2" opacity="0.6"/>
          <line x1="205" y1="120" x2="55" y2="120" stroke="#38BDF8" stroke-width="1.2" opacity="0.6"/>

          <rect x="80" y="132" width="100" height="26" rx="6" fill="rgba(0,0,0,0.75)" stroke="#38BDF8" stroke-width="1.2"/>
          <text x="130" y="149" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">QUORUM OK</text>
        </g>
      

  <!-- Bottom Brand Signature -->
  <g transform="translate(48, 435)">
    <text x="0" y="0" fill="#94a3b8" font-family="monospace" font-size="11">ENGINE SPEC: v2026 // OPEN TECHNICAL TAXONOMY</text>
    <text x="704" y="0" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">Gui13go Database Gallery &rarr;</text>
  </g>
</svg>