<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad_SQL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051622"/>
      <stop offset="50%" stop-color="#003B57" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="mesh_SQL" cx="20%" cy="15%" r="75%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#003B57" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <circle cx="32" cy="32" r="1" fill="rgba(255,255,255,0.08)"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#030712"/>
  <rect width="100%" height="100%" fill="url(#bgGrad_SQL)"/>
  <rect width="100%" height="100%" fill="url(#gridPattern)"/>
  <rect width="100%" height="100%" fill="url(#mesh_SQL)"/>

  <!-- Subtle Top Decorative Status Line -->
  <rect x="0" y="0" width="100%" height="4" fill="#38BDF8"/>

  <!-- Top Header Metadata Bar -->
  <g transform="translate(48, 44)">
    <!-- Symbol Shield -->
    <rect x="0" y="0" width="56" height="56" rx="12" fill="rgba(255,255,255,0.06)" stroke="#38BDF8" stroke-width="1.8"/>
    <text x="28" y="35" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" text-anchor="middle">SQL</text>

    <!-- Subtitle Category Badge -->
    <rect x="68" y="4" width="223" height="24" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="80" cy="16" r="4" fill="#38BDF8"/>
    <text x="92" y="20" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700" letter-spacing="0.05em">SERVERLESS EMBEDDED RDBMS</text>
  </g>

  <!-- Database Title -->
  <text x="48" y="165" fill="#f8fafc" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="900" font-size="46" letter-spacing="-0.03em">SQLite</text>

  <!-- Architectural Internals Specification List -->
  <g transform="translate(48, 205)">
    <rect x="0" y="0" width="380" height="180" rx="12" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>
    <text x="18" y="28" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700" letter-spacing="0.06em">ENGINE ARCHITECTURE &amp; INTERNALS</text>
    <line x1="18" y1="38" x2="362" y2="38" stroke="rgba(255,255,255,0.08)"/>

    
      <g transform="translate(18, 58)">
        <circle cx="5" cy="5" r="3.5" fill="#38BDF8"/>
        <text x="16" y="9" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600">B-TREE / PAGER SUBSYSTEM</text>
      </g>
    
      <g transform="translate(18, 86)">
        <circle cx="5" cy="5" r="3.5" fill="#38BDF8"/>
        <text x="16" y="9" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600">SINGLE DISK FILE (.db)</text>
      </g>
    
      <g transform="translate(18, 114)">
        <circle cx="5" cy="5" r="3.5" fill="#38BDF8"/>
        <text x="16" y="9" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600">ZERO-CONFIG IN-PROCESS</text>
      </g>
    
      <g transform="translate(18, 142)">
        <circle cx="5" cy="5" r="3.5" fill="#38BDF8"/>
        <text x="16" y="9" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600">CONCURRENT WAL READERS</text>
      </g>
    
  </g>

  <!-- Right Side Interactive Architectural Blueprint -->
  
        <!-- B-Tree Hierarchy -->
        <g transform="translate(470, 110)">
          <!-- Root Node -->
          <rect x="75" y="0" width="130" height="52" rx="8" fill="#0f2942" stroke="#38BDF8" stroke-width="1.8"/>
          <text x="140" y="24" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">B-Tree Root Node</text>
          <text x="140" y="42" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">[Key: 50 | Ptr1 | Ptr2]</text>

          <!-- Branch Lines -->
          <line x1="110" y1="52" x2="55" y2="105" stroke="#38BDF8" stroke-width="1.6"/>
          <line x1="170" y1="52" x2="225" y2="105" stroke="#38BDF8" stroke-width="1.6"/>

          <!-- Internal Left -->
          <rect x="0" y="105" width="115" height="50" rx="8" fill="#133659" stroke="rgba(255,255,255,0.2)"/>
          <text x="57" y="128" fill="#e2e8f0" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">Branch Node A</text>
          <text x="57" y="144" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">Keys: [10, 25]</text>

          <!-- Internal Right -->
          <rect x="165" y="105" width="115" height="50" rx="8" fill="#133659" stroke="rgba(255,255,255,0.2)"/>
          <text x="222" y="128" fill="#e2e8f0" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">Branch Node B</text>
          <text x="222" y="144" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">Keys: [75, 90]</text>

          <!-- Leaf Level -->
          <line x1="57" y1="155" x2="57" y2="200" stroke="#38BDF8" stroke-width="1.4"/>
          <line x1="222" y1="155" x2="222" y2="200" stroke="#38BDF8" stroke-width="1.4"/>

          <rect x="0" y="200" width="125" height="60" rx="8" fill="#082038" stroke="#38BDF8" stroke-width="1.2"/>
          <text x="62" y="224" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">LEAF DATA PAGE</text>
          <text x="62" y="244" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">Records: [1..25]</text>

          <rect x="155" y="200" width="125" height="60" rx="8" fill="#082038" stroke="#38BDF8" stroke-width="1.2"/>
          <text x="217" y="224" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">LEAF DATA PAGE</text>
          <text x="217" y="244" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">Records: [50..99]</text>
        </g>
      

  <!-- Bottom Brand Signature -->
  <g transform="translate(48, 435)">
    <text x="0" y="0" fill="#94a3b8" font-family="monospace" font-size="11">ENGINE SPEC: v2026 // OPEN TECHNICAL TAXONOMY</text>
    <text x="704" y="0" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">Gui13go Database Gallery &rarr;</text>
  </g>
</svg>