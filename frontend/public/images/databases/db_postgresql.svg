<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad_PG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1523"/>
      <stop offset="50%" stop-color="#336791" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="mesh_PG" cx="20%" cy="15%" r="75%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#336791" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <circle cx="32" cy="32" r="1" fill="rgba(255,255,255,0.08)"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#030712"/>
  <rect width="100%" height="100%" fill="url(#bgGrad_PG)"/>
  <rect width="100%" height="100%" fill="url(#gridPattern)"/>
  <rect width="100%" height="100%" fill="url(#mesh_PG)"/>

  <!-- Subtle Top Decorative Status Line -->
  <rect x="0" y="0" width="100%" height="4" fill="#10b981"/>

  <!-- Top Header Metadata Bar -->
  <g transform="translate(48, 44)">
    <!-- Symbol Shield -->
    <rect x="0" y="0" width="56" height="56" rx="12" fill="rgba(255,255,255,0.06)" stroke="#10b981" stroke-width="1.8"/>
    <text x="28" y="35" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" text-anchor="middle">PG</text>

    <!-- Subtitle Category Badge -->
    <rect x="68" y="4" width="220" height="24" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="80" cy="16" r="4" fill="#10b981"/>
    <text x="92" y="20" fill="#10b981" font-family="monospace" font-size="11" font-weight="700" letter-spacing="0.05em">RELATIONAL ORDBMS</text>
  </g>

  <!-- Database Title -->
  <text x="48" y="165" fill="#f8fafc" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="900" font-size="46" letter-spacing="-0.03em">PostgreSQL</text>

  <!-- Architectural Internals Specification List -->
  <g transform="translate(48, 205)">
    <rect x="0" y="0" width="380" height="180" rx="12" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>
    <text x="18" y="28" fill="#10b981" font-family="monospace" font-size="11" font-weight="700" letter-spacing="0.06em">ENGINE ARCHITECTURE &amp; INTERNALS</text>
    <line x1="18" y1="38" x2="362" y2="38" stroke="rgba(255,255,255,0.08)"/>

    
      <g transform="translate(18, 58)">
        <circle cx="5" cy="5" r="3.5" fill="#10b981"/>
        <text x="16" y="9" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600">HEAP STORAGE + WAL</text>
      </g>
    
      <g transform="translate(18, 86)">
        <circle cx="5" cy="5" r="3.5" fill="#10b981"/>
        <text x="16" y="9" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600">MVCC SNAPSHOTS</text>
      </g>
    
      <g transform="translate(18, 114)">
        <circle cx="5" cy="5" r="3.5" fill="#10b981"/>
        <text x="16" y="9" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600">PL/PGSQL & JSONB</text>
      </g>
    
      <g transform="translate(18, 142)">
        <circle cx="5" cy="5" r="3.5" fill="#10b981"/>
        <text x="16" y="9" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600">PGVECTOR & POSTGIS</text>
      </g>
    
  </g>

  <!-- Right Side Interactive Architectural Blueprint -->
  
        <!-- MVCC Version Chain -->
        <g transform="translate(480, 110)">
          <!-- Page Slot -->
          <rect x="0" y="0" width="260" height="260" rx="14" fill="#0f1f33" stroke="#10b981" stroke-width="1.8" opacity="0.9"/>
          <text x="16" y="28" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">PAGE HEADER (LSN 0x4A1F)</text>
          
          <!-- Tuple Version 1 -->
          <rect x="16" y="44" width="228" height="58" rx="8" fill="#182d47" stroke="rgba(255,255,255,0.1)"/>
          <text x="28" y="68" fill="#94a3b8" font-family="monospace" font-size="11">Tuple v1 [xmin:100, xmax:102]</text>
          <text x="28" y="88" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600">val = 42 (expired)</text>
          <path d="M 230 73 L 260 73 L 260 115 L 244 115" fill="none" stroke="#10b981" stroke-dasharray="3,3" stroke-width="1.5"/>

          <!-- Tuple Version 2 (Current) -->
          <rect x="16" y="112" width="228" height="58" rx="8" fill="#1d3b5e" stroke="#10b981" stroke-width="1.2"/>
          <text x="28" y="136" fill="#10b981" font-family="monospace" font-size="11">Tuple v2 [xmin:102, xmax:0]</text>
          <text x="28" y="156" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">val = 99 (VISIBLE: MVCC)</text>

          <!-- Free Space -->
          <rect x="16" y="180" width="228" height="66" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)" stroke-dasharray="4,4"/>
          <text x="130" y="218" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Unallocated Page Buffer Space</text>
        </g>
      

  <!-- Bottom Brand Signature -->
  <g transform="translate(48, 435)">
    <text x="0" y="0" fill="#94a3b8" font-family="monospace" font-size="11">ENGINE SPEC: v2026 // OPEN TECHNICAL TAXONOMY</text>
    <text x="704" y="0" fill="#10b981" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">Gui13go Database Gallery &rarr;</text>
  </g>
</svg>